[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "venv", "migrations", "staticfiles", "media"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E", "F", "B"]

[project]
name = "find-uz"
version = "0.1.0"
description = "Dictionary + find-uz Django REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adrf==0.1.9",
    "asgiref==3.8.1",
    "django==5.2.1",
    "django-cors-headers>=4.7.0",
    "djangorestframework==3.16.0",
    "djangorestframework-simplejwt==5.5.0",
    "drf-orjson-renderer>=1.7.3",
    "drf-spectacular==0.28.0",
    "inflection==0.5.1",
    "pillow==11.2.1",
    "psycopg[binary]>=3.2",
    "pyjwt==2.9.0",
    "python-decouple>=3.8",
    "pyyaml==6.0.2",
    "uvicorn==0.34.2",
    "whitenoise==6.9.0",
]
